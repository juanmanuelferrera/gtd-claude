name: Claude Translator

on:
  # Option 1: Trigger manually with a button
  workflow_dispatch:
    inputs:
      source_file:
        description: 'File to translate (e.g., nama.org, README.md)'
        required: true
        default: 'nama.org'
      target_language:
        description: 'Target language (e.g., Spanish, French, German)'
        required: true
        default: 'Spanish'

  # Option 2: Trigger by commenting on an issue or PR
  issue_comment:
    types: [created]

jobs:
  translate:
    # Only run if comment contains "@claude translate"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@claude translate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Claude Translation
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          permission_mode: auto_approve_read_write
          prompt: |
            Translate ${{ github.event.inputs.source_file || 'nama.org' }} to ${{ github.event.inputs.target_language || 'Spanish' }}.

            Steps:
            1. Read the entire source file content
            2. Translate ALL text naturally to Latin American Spanish
            3. Use Edit tool to replace the ENTIRE file content with the translation (use old_string = entire file content, new_string = translated content)

            Don't translate: code blocks, URLs, org-mode syntax (*, TODO, DONE), technical terms (Krsna, Vaisnava, etc.)
            Do NOT use git commands - the workflow handles commits

      - name: Commit Translation
        run: |
          git config --local user.email "claude[bot]@users.noreply.github.com"
          git config --local user.name "claude[bot]"
          git add .
          git commit -m "Add ${{ github.event.inputs.target_language || 'Spanish' }} translation of ${{ github.event.inputs.source_file || 'nama.org' }}" || echo "No changes to commit"
          git push
