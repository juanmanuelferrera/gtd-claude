<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔐 Login Test</h1>
    
    <div id="results"></div>
    
    <button onclick="testLogin()">Test Login</button>
    <button onclick="clearStorage()">Clear Storage</button>
    
    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            addResult('🧹 Storage cleared', 'info');
        }
        
        async function testLogin() {
            addResult('🧪 Starting login test...', 'info');
            
            // Test 1: Check if stale user ID is detected
            const storedUserId = localStorage.getItem('userId');
            if (storedUserId === '56c2c350-3645-4729-a0cd-5b8d01a110a1') {
                addResult('🚫 Stale user ID detected - should be cleared', 'error');
                return;
            }
            
            // Test 2: Check backend health
            try {
                const healthResponse = await fetch(`${API_BASE}/health`);
                if (healthResponse.ok) {
                    addResult('✅ Backend health check passed', 'success');
                } else {
                    addResult('❌ Backend health check failed', 'error');
                    return;
                }
            } catch (error) {
                addResult('❌ Backend health check error: ' + error.message, 'error');
                return;
            }
            
            // Test 3: Try login with test credentials
            addResult('🔐 Attempting login...', 'info');
            
            try {
                const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'testpassword'
                    })
                });
                
                if (loginResponse.status === 401) {
                    addResult('✅ Login endpoint working (expected 401 for test credentials)', 'success');
                } else if (loginResponse.ok) {
                    addResult('✅ Login successful!', 'success');
                } else {
                    addResult('❌ Login failed with status: ' + loginResponse.status, 'error');
                }
            } catch (error) {
                addResult('❌ Login request error: ' + error.message, 'error');
            }
            
            addResult('🏁 Login test complete', 'info');
        }
        
        // Auto-run test on page load
        window.addEventListener('load', () => {
            addResult('📱 Page loaded - ready for testing', 'info');
        });
    </script>
</body>
</html>
