<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ HyperFiler Pro 🚀 - v4.5.4 Modular (TEST)</title>

    <script>
    console.log('🧪 TESTING MODULAR VERSION - v4.5.4');
    console.log('Phase 5 Complete: Data operations extracted (17 functions)');
    console.log('Total: 60 functions in 6 modules - 71 automated tests');
    </script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>🧪 Modular Version Test</h1>
    <p>Testing ES6 modules...</p>

    <div id="test-results"></div>

    <script>
    // Test all modules after they load
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const results = document.getElementById('test-results');
            let testsPassed = 0;
            let testsFailed = 0;

            // Test sanitization module
            if (typeof window.sanitizeHTML === 'function') {
                results.innerHTML += '<p>✅ sanitizeHTML loaded</p>';
                const test = window.sanitizeHTML('Hello<test>World');
                // sanitizeHTML escapes HTML, so < becomes &lt;
                if (test.includes('&lt;') && test.includes('&gt;')) {
                    results.innerHTML += `<p>✅ sanitizeHTML escapes HTML correctly</p>`;
                    testsPassed++;
                } else {
                    results.innerHTML += `<p>❌ sanitizeHTML failed: got "${test}"</p>`;
                    testsFailed++;
                }
            } else {
                results.innerHTML += '<p>❌ sanitizeHTML NOT loaded</p>';
                testsFailed++;
            }

            if (typeof window.sanitizeInput === 'function') {
                results.innerHTML += '<p>✅ sanitizeInput loaded</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ sanitizeInput NOT loaded</p>';
                testsFailed++;
            }

            // Test utils module
            const utilFunctions = [
                'normalizeDueTime',
                'escapeHtml',
                'formatDate',
                'formatDateForFilename',
                'formatTime',
                'getLocalDateString',
                'validateTaskInput',
                'validateTaskTitle',
                'validateTaskNotes'
            ];

            // Test storage module
            const storageFunctions = [
                'getLocal',
                'setLocal',
                'removeLocal',
                'clearLocal',
                'getSession',
                'setSession',
                'removeSession',
                'clearSession',
                'isLocalStorageAvailable',
                'isSessionStorageAvailable'
            ];

            // Test tasks module
            const taskFunctions = [
                'generateTaskId',
                'createTaskObject',
                'validateTaskData',
                'cleanTaskForStorage',
                'taskHasImages',
                'isTaskOverdue',
                'isTaskToday',
                'isTaskFuture',
                'isTaskCompleted',
                'isTaskActive',
                'getTaskStatusText'
            ];

            // Test i18n module
            const i18nFunctions = [
                'getCurrentLanguage',
                'setLanguage',
                't',
                'translateText',
                'getAvailableLanguages',
                'isLanguageSupported',
                'getLanguageTranslations',
                'addTranslations',
                'getTranslationStats'
            ];

            // Test data-operations module
            const dataOpsFunctions = [
                'saveTasksToLocalStorage',
                'loadTasksFromLocalStorage',
                'sortTasks',
                'loadEventRegistry',
                'saveEventRegistry',
                'markAsEvent',
                'unmarkAsEvent',
                'isRegisteredEvent',
                'healEventProperties',
                'cleanEventRegistry',
                'filterTasksByDateRange',
                'filterTasksByStatus',
                'searchTasks',
                'getTasksForDate',
                'getActiveTasks',
                'getCompletedTasks'
            ];

            utilFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.innerHTML += `<p>✅ ${funcName} loaded</p>`;
                    testsPassed++;
                } else {
                    results.innerHTML += `<p>❌ ${funcName} NOT loaded</p>`;
                    testsFailed++;
                }
            });

            storageFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.innerHTML += `<p>✅ ${funcName} loaded</p>`;
                    testsPassed++;
                } else {
                    results.innerHTML += `<p>❌ ${funcName} NOT loaded</p>`;
                    testsFailed++;
                }
            });

            taskFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.innerHTML += `<p>✅ ${funcName} loaded</p>`;
                    testsPassed++;
                } else {
                    results.innerHTML += `<p>❌ ${funcName} NOT loaded</p>`;
                    testsFailed++;
                }
            });

            i18nFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.innerHTML += `<p>✅ ${funcName} loaded</p>`;
                    testsPassed++;
                } else {
                    results.innerHTML += `<p>❌ ${funcName} NOT loaded</p>`;
                    testsFailed++;
                }
            });

            dataOpsFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.innerHTML += `<p>✅ ${funcName} loaded</p>`;
                    testsPassed++;
                } else {
                    results.innerHTML += `<p>❌ ${funcName} NOT loaded</p>`;
                    testsFailed++;
                }
            });

            // Test actual functionality
            const dateTest = window.getLocalDateString(new Date('2025-01-15'));
            if (dateTest === '2025-01-15') {
                results.innerHTML += '<p>✅ getLocalDateString works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getLocalDateString failed: got "${dateTest}"</p>`;
                testsFailed++;
            }

            const timeNormTest = window.normalizeDueTime('00:00');
            if (timeNormTest === null) {
                results.innerHTML += '<p>✅ normalizeDueTime works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ normalizeDueTime failed: got "${timeNormTest}"</p>`;
                testsFailed++;
            }

            // Test storage functionality
            const testKey = '__modular_test__';
            const testValue = { foo: 'bar', num: 42 };

            const setResult = window.setLocal(testKey, testValue);
            if (setResult) {
                results.innerHTML += '<p>✅ setLocal works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ setLocal failed</p>';
                testsFailed++;
            }

            const getResult = window.getLocal(testKey);
            if (JSON.stringify(getResult) === JSON.stringify(testValue)) {
                results.innerHTML += '<p>✅ getLocal works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getLocal failed: got ${JSON.stringify(getResult)}</p>`;
                testsFailed++;
            }

            const removeResult = window.removeLocal(testKey);
            const afterRemove = window.getLocal(testKey);
            if (removeResult && afterRemove === null) {
                results.innerHTML += '<p>✅ removeLocal works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ removeLocal failed</p>';
                testsFailed++;
            }

            const isAvailable = window.isLocalStorageAvailable();
            if (isAvailable === true) {
                results.innerHTML += '<p>✅ isLocalStorageAvailable works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ isLocalStorageAvailable failed</p>';
                testsFailed++;
            }

            // Test task functionality
            const taskId = window.generateTaskId();
            if (taskId && taskId.length > 0) {
                results.innerHTML += '<p>✅ generateTaskId works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ generateTaskId failed</p>';
                testsFailed++;
            }

            const newTask = window.createTaskObject({ title: 'Test Task', dueDate: '2025-01-15' });
            if (newTask && newTask.title === 'Test Task' && newTask.dueDate === '2025-01-15') {
                results.innerHTML += '<p>✅ createTaskObject works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ createTaskObject failed</p>';
                testsFailed++;
            }

            const today = window.getLocalDateString();
            const todayTask = window.createTaskObject({ title: 'Today Task', dueDate: today });
            if (window.isTaskToday(todayTask) === true) {
                results.innerHTML += '<p>✅ isTaskToday works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ isTaskToday failed</p>';
                testsFailed++;
            }

            const overdueTask = window.createTaskObject({ title: 'Old Task', dueDate: '2020-01-01', status: 'active' });
            if (window.isTaskOverdue(overdueTask) === true) {
                results.innerHTML += '<p>✅ isTaskOverdue works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ isTaskOverdue failed</p>';
                testsFailed++;
            }

            const completedTask = window.createTaskObject({ title: 'Done', status: 'completed' });
            if (window.isTaskCompleted(completedTask) === true) {
                results.innerHTML += '<p>✅ isTaskCompleted works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ isTaskCompleted failed</p>';
                testsFailed++;
            }

            const statusText = window.getTaskStatusText(todayTask);
            if (statusText === 'Due Today') {
                results.innerHTML += '<p>✅ getTaskStatusText works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getTaskStatusText failed: got "${statusText}"</p>`;
                testsFailed++;
            }

            // Test i18n functionality
            const currentLang = window.getCurrentLanguage();
            if (currentLang === 'en') {
                results.innerHTML += '<p>✅ getCurrentLanguage works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getCurrentLanguage failed: got "${currentLang}"</p>`;
                testsFailed++;
            }

            const translationEn = window.t('Today');
            if (translationEn === 'Today') {
                results.innerHTML += '<p>✅ t() translates correctly (en)</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ t() failed: got "${translationEn}"</p>`;
                testsFailed++;
            }

            const langChanged = window.setLanguage('es');
            const translationEs = window.t('Today');
            if (langChanged && translationEs === 'Hoy') {
                results.innerHTML += '<p>✅ setLanguage() and t() work for Spanish</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ Spanish translation failed: got "${translationEs}"</p>`;
                testsFailed++;
            }

            // Reset to English
            window.setLanguage('en');

            const availableLangs = window.getAvailableLanguages();
            if (Array.isArray(availableLangs) && availableLangs.length === 2) {
                results.innerHTML += '<p>✅ getAvailableLanguages returns 2 languages</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getAvailableLanguages failed: got ${availableLangs.length} languages</p>`;
                testsFailed++;
            }

            const langSupported = window.isLanguageSupported('es');
            if (langSupported === true) {
                results.innerHTML += '<p>✅ isLanguageSupported works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ isLanguageSupported failed</p>';
                testsFailed++;
            }

            const stats = window.getTranslationStats();
            if (stats && stats.en > 0 && stats.es > 0) {
                results.innerHTML += `<p>✅ getTranslationStats works (en: ${stats.en}, es: ${stats.es})</p>`;
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ getTranslationStats failed</p>';
                testsFailed++;
            }

            // Test data-operations functionality
            const testTasks = [
                window.createTaskObject({ title: 'Task 1', dueDate: '2025-11-05', status: 'active' }),
                window.createTaskObject({ title: 'Task 2', dueDate: '2025-11-03', status: 'completed' }),
                window.createTaskObject({ title: 'Task 3', dueDate: '2025-11-05', status: 'active' }),
                window.createTaskObject({ title: 'Search Me', dueDate: '2025-11-10', status: 'active' })
            ];

            // Test sortTasks
            const unsortedTasks = [...testTasks];
            const sorted = window.sortTasks(unsortedTasks);
            if (sorted[0].status === 'active' && sorted[sorted.length - 1].status === 'completed') {
                results.innerHTML += '<p>✅ sortTasks works correctly (active before completed)</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ sortTasks failed</p>';
                testsFailed++;
            }

            // Test filterTasksByStatus
            const activeTasks = window.getActiveTasks(testTasks);
            if (activeTasks.length === 3) {
                results.innerHTML += '<p>✅ getActiveTasks works correctly (3 active tasks)</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getActiveTasks failed: got ${activeTasks.length} tasks</p>`;
                testsFailed++;
            }

            const completedTasksOnly = window.getCompletedTasks(testTasks);
            if (completedTasksOnly.length === 1) {
                results.innerHTML += '<p>✅ getCompletedTasks works correctly (1 completed task)</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getCompletedTasks failed: got ${completedTasksOnly.length} tasks</p>`;
                testsFailed++;
            }

            // Test getTasksForDate
            const tasksFor1105 = window.getTasksForDate(testTasks, '2025-11-05');
            if (tasksFor1105.length === 2) {
                results.innerHTML += '<p>✅ getTasksForDate works correctly (2 tasks on 11/05)</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ getTasksForDate failed: got ${tasksFor1105.length} tasks</p>`;
                testsFailed++;
            }

            // Test searchTasks
            const searchResults = window.searchTasks(testTasks, 'Search');
            if (searchResults.length === 1 && searchResults[0].title === 'Search Me') {
                results.innerHTML += '<p>✅ searchTasks works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ searchTasks failed: got ${searchResults.length} results</p>`;
                testsFailed++;
            }

            // Test filterTasksByDateRange
            const rangeResults = window.filterTasksByDateRange(testTasks, '2025-11-03', '2025-11-05');
            if (rangeResults.length === 3) {
                results.innerHTML += '<p>✅ filterTasksByDateRange works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ filterTasksByDateRange failed: got ${rangeResults.length} tasks</p>`;
                testsFailed++;
            }

            // Test save/load operations
            const saveResult = window.saveTasksToLocalStorage(testTasks);
            if (saveResult) {
                results.innerHTML += '<p>✅ saveTasksToLocalStorage works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ saveTasksToLocalStorage failed</p>';
                testsFailed++;
            }

            const loadedTasks = window.loadTasksFromLocalStorage();
            if (loadedTasks.length === 4) {
                results.innerHTML += '<p>✅ loadTasksFromLocalStorage works correctly (4 tasks loaded)</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ loadTasksFromLocalStorage failed: got ${loadedTasks.length} tasks</p>`;
                testsFailed++;
            }

            // Test event registry operations
            const eventRegistry = new Set();
            window.markAsEvent(eventRegistry, 'event-123');
            if (eventRegistry.has('event-123')) {
                results.innerHTML += '<p>✅ markAsEvent works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ markAsEvent failed</p>';
                testsFailed++;
            }

            const isEvent = window.isRegisteredEvent(eventRegistry, 'event-123');
            if (isEvent === true) {
                results.innerHTML += '<p>✅ isRegisteredEvent works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ isRegisteredEvent failed</p>';
                testsFailed++;
            }

            window.unmarkAsEvent(eventRegistry, 'event-123');
            if (!eventRegistry.has('event-123')) {
                results.innerHTML += '<p>✅ unmarkAsEvent works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += '<p>❌ unmarkAsEvent failed</p>';
                testsFailed++;
            }

            // Test healEventProperties
            const tasksToHeal = [
                window.createTaskObject({ id: 'heal-1', title: 'Event Task', isEvent: false })
            ];
            const healRegistry = new Set(['heal-1']);
            const healedCount = window.healEventProperties(tasksToHeal, healRegistry);
            if (healedCount === 1 && tasksToHeal[0].isEvent === true) {
                results.innerHTML += '<p>✅ healEventProperties works correctly</p>';
                testsPassed++;
            } else {
                results.innerHTML += `<p>❌ healEventProperties failed: healed ${healedCount}, isEvent=${tasksToHeal[0].isEvent}</p>`;
                testsFailed++;
            }

            // Clean up test data
            localStorage.removeItem('gtdTasks');
            localStorage.removeItem('gtd_event_registry');

            // Summary
            results.innerHTML += `<hr><p><strong>Tests: ${testsPassed} passed, ${testsFailed} failed</strong></p>`;
        }, 1000);
    });
    </script>

    <!-- Load modular system using ES6 modules -->
    <script type="module" src="src/main.js"></script>

    <p style="margin-top: 40px; padding: 20px; background: #f0f0f0; border-left: 4px solid #007aff;">
        <strong>📋 Test Checklist:</strong><br>
        1. Open browser console<br>
        2. Check for "Modular system initialized" message<br>
        3. Verify no errors<br>
        4. Test functions above
    </p>
</body>
</html>
