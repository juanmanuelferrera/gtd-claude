name: Claude Translator

on:
  # Option 1: Trigger manually with a button
  workflow_dispatch:
    inputs:
      source_file:
        description: 'File to translate (e.g., nama.org, README.md)'
        required: true
        default: 'nama.org'
      target_language:
        description: 'Target language (e.g., Spanish, French, German)'
        required: true
        default: 'Spanish'

  # Option 2: Trigger by commenting on an issue or PR
  issue_comment:
    types: [created]

jobs:
  translate:
    # Only run if comment contains "@claude translate"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@claude translate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Claude Translation
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a professional ${{ github.event.inputs.target_language || 'Spanish' }} translator specializing in natural, culturally-appropriate translations.

            ## Source File:
            ${{ github.event.inputs.source_file || 'nama.org' }}

            ## Translation Task:
            1. Read the source file
            2. Translate ALL text to ${{ github.event.inputs.target_language || 'Spanish' }}
            3. Create translated file using Write tool:
               - For .org files: filename-es.org (e.g., nama.org → nama-es.org)
               - For .md files: filename-es.md
               - Same directory as source

            ## Style & Quality Requirements:

            ### Natural Language:
            - Write how native speakers actually talk, not word-for-word literal translation
            - Use Latin American Spanish (neutral variant understood across regions)
            - Match the original tone (formal/informal/technical/casual)
            - Make it sound like it was originally written in Spanish

            ### What to Translate:
            ✅ All body text, headings, and descriptions
            ✅ UI labels, buttons, and messages
            ✅ Comments and explanations
            ✅ Error messages and notifications

            ### What NOT to Translate:
            ❌ Code blocks (#+BEGIN_SRC...#+END_SRC)
            ❌ Variable/function names
            ❌ URLs and file paths
            ❌ Brand names
            ❌ Widely-used technical terms (API, HTML, JSON, etc.)
            ❌ Org-mode syntax (*, **, TODO, DONE, SCHEDULED, etc.)

            ### Special Handling:
            - **Acronyms**: Keep English but explain in Spanish on first use if needed
            - **Cultural references**: Adapt if they don't translate well
            - **Idioms**: Find Spanish equivalent, not literal translation
            - **Formality**: Use "tú" (informal, friendly tone)
            - **Technical terms**: Keep commonly-used English terms (framework, backend, etc.)

            ### Quality Checks:
            - Does it sound natural when read aloud in Spanish?
            - Would a native Spanish speaker understand without the English?
            - Are verb tenses consistent?
            - Does it maintain the same emotional impact?

            ### Formatting Preservation:
            - Keep exact Org-mode structure (headlines, lists, properties)
            - Maintain indentation and spacing
            - Preserve links: [[url][text]] → translate only [text]
            - Keep all markup syntax unchanged

            ## Important:
            - Use Write tool to create the translated file
            - Do NOT use git commands - workflow handles commits
            - Double-check that code blocks remain untranslated

      - name: Commit Translation
        run: |
          git config --local user.email "claude[bot]@users.noreply.github.com"
          git config --local user.name "claude[bot]"
          git add .
          git commit -m "Add ${{ github.event.inputs.target_language || 'Spanish' }} translation of ${{ github.event.inputs.source_file || 'nama.org' }}" || echo "No changes to commit"
          git push
