<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        input, button { margin: 5px; padding: 10px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔐 Simple Login Test</h1>
    
    <div>
        <input type="email" id="email" placeholder="Email" value="">
        <input type="password" id="password" placeholder="Password" value="">
        <button onclick="testLogin()">Test Login</button>
        <button onclick="checkStorage()">Check Storage</button>
        <button onclick="clearStorage()">Clear Storage</button>
    </div>
    
    <div id="logs"></div>
    
    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logs.appendChild(div);
        }
        
        function logJSON(title, data) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log info';
            div.innerHTML = `<strong>${title}:</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
            logs.appendChild(div);
        }
        
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            log('🧹 Storage cleared', 'success');
        }
        
        function checkStorage() {
            log('🔍 Checking storage...', 'info');
            
            const authToken = localStorage.getItem('authToken');
            const authTokenExpiry = localStorage.getItem('authTokenExpiry');
            const userEmail = localStorage.getItem('userEmail');
            const userId = localStorage.getItem('userId');
            
            log(`Token: ${authToken ? 'Present (' + authToken.length + ' chars)' : 'Missing'}`, authToken ? 'success' : 'error');
            log(`Expiry: ${authTokenExpiry ? new Date(parseInt(authTokenExpiry)).toLocaleString() : 'Missing'}`, authTokenExpiry ? 'success' : 'error');
            log(`Email: ${userEmail || 'Missing'}`, userEmail ? 'success' : 'error');
            log(`User ID: ${userId || 'Missing'}`, userId ? 'success' : 'error');
            
            // Check sessionStorage
            const sessionToken = sessionStorage.getItem('authToken');
            log(`Session Token: ${sessionToken ? 'Present' : 'Missing'}`, sessionToken ? 'success' : 'info');
        }
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                log('Please enter email and password', 'error');
                return;
            }
            
            log('🔐 Starting login test...', 'info');
            
            try {
                log('📡 Sending login request...', 'info');
                
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                log(`📡 Response status: ${response.status}`, response.ok ? 'success' : 'error');
                log(`📡 Response ok: ${response.ok}`, 'info');
                
                const result = await response.json();
                logJSON('Response Body', result);
                
                if (response.ok && result.user) {
                    log('✅ Login successful!', 'success');
                    
                    // Check response structure
                    if (result.user) {
                        log(`✅ User object found with ID: ${result.user.id}`, 'success');
                        log(`✅ User email: ${result.user.email}`, 'success');
                    } else {
                        log('❌ No user object in response', 'error');
                    }
                    
                    if (result.token) {
                        log(`✅ Token found (length: ${result.token.length})`, 'success');
                    } else {
                        log('❌ No token in response', 'error');
                    }
                    
                    // Test storage step by step
                    log('🧪 Testing storage step by step...', 'info');
                    
                    try {
                        localStorage.setItem('authToken', result.token);
                        log('✅ Token stored in localStorage', 'success');
                    } catch (e) {
                        log(`❌ Failed to store token: ${e.message}`, 'error');
                    }
                    
                    try {
                        localStorage.setItem('authTokenExpiry', Date.now() + (24 * 60 * 60 * 1000));
                        log('✅ Expiry stored in localStorage', 'success');
                    } catch (e) {
                        log(`❌ Failed to store expiry: ${e.message}`, 'error');
                    }
                    
                    try {
                        localStorage.setItem('userEmail', result.user.email);
                        log('✅ Email stored in localStorage', 'success');
                    } catch (e) {
                        log(`❌ Failed to store email: ${e.message}`, 'error');
                    }
                    
                    try {
                        localStorage.setItem('userId', result.user.id);
                        log('✅ User ID stored in localStorage', 'success');
                    } catch (e) {
                        log(`❌ Failed to store user ID: ${e.message}`, 'error');
                    }
                    
                    // Verify storage worked
                    log('🔍 Verifying storage...', 'info');
                    const storedToken = localStorage.getItem('authToken');
                    const storedUserId = localStorage.getItem('userId');
                    const storedEmail = localStorage.getItem('userEmail');
                    const storedExpiry = localStorage.getItem('authTokenExpiry');
                    
                    log(`Verification - Token: ${!!storedToken}`, storedToken ? 'success' : 'error');
                    log(`Verification - User ID: ${storedUserId}`, storedUserId ? 'success' : 'error');
                    log(`Verification - Email: ${storedEmail}`, storedEmail ? 'success' : 'error');
                    log(`Verification - Expiry: ${storedExpiry ? 'Present' : 'Missing'}`, storedExpiry ? 'success' : 'error');
                    
                } else {
                    log(`❌ Login failed: ${result.message || result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        // Auto-check storage on page load
        window.addEventListener('load', () => {
            log('📱 Page loaded', 'info');
            checkStorage();
        });
    </script>
</body>
</html>
