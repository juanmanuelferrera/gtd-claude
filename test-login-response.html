<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Response Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        input, button { margin: 5px; padding: 10px; }
        .response-data { background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔐 Login Response Test</h1>
    
    <div>
        <input type="email" id="email" placeholder="Email" value="">
        <input type="password" id="password" placeholder="Password" value="">
        <button onclick="testLogin()">Test Login Response</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            results.appendChild(div);
        }
        
        function addResponseData(title, data) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'response-data';
            div.innerHTML = `<strong>${title}:</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            results.appendChild(div);
        }
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                addResult('Please enter email and password', 'error');
                return;
            }
            
            addResult('🔐 Testing login response...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                addResult(`Response status: ${response.status}`, response.ok ? 'success' : 'error');
                addResult(`Response ok: ${response.ok}`, 'info');
                
                const result = await response.json();
                addResponseData('Response Body', result);
                
                if (response.ok) {
                    addResult('✅ Login successful!', 'success');
                    
                    // Check response structure
                    if (result.user) {
                        addResult(`✅ User object found with ID: ${result.user.id}`, 'success');
                        addResult(`✅ User email: ${result.user.email}`, 'success');
                    } else {
                        addResult('❌ No user object in response', 'error');
                    }
                    
                    if (result.token) {
                        addResult(`✅ Token found (length: ${result.token.length})`, 'success');
                    } else {
                        addResult('❌ No token in response', 'error');
                    }
                    
                    // Test storage
                    addResult('🧪 Testing storage...', 'info');
                    localStorage.setItem('test-token', result.token);
                    localStorage.setItem('test-user-id', result.user.id);
                    localStorage.setItem('test-email', result.user.email);
                    
                    const storedToken = localStorage.getItem('test-token');
                    const storedUserId = localStorage.getItem('test-user-id');
                    const storedEmail = localStorage.getItem('test-email');
                    
                    addResult(`Storage test - Token: ${!!storedToken}`, storedToken ? 'success' : 'error');
                    addResult(`Storage test - User ID: ${storedUserId}`, storedUserId ? 'success' : 'error');
                    addResult(`Storage test - Email: ${storedEmail}`, storedEmail ? 'success' : 'error');
                    
                    // Clean up test data
                    localStorage.removeItem('test-token');
                    localStorage.removeItem('test-user-id');
                    localStorage.removeItem('test-email');
                    
                } else {
                    addResult(`❌ Login failed: ${result.message || result.error}`, 'error');
                }
                
            } catch (error) {
                addResult(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        // Auto-fill with test data
        window.addEventListener('load', () => {
            addResult('📱 Page loaded - enter your real credentials to test', 'info');
        });
    </script>
</body>
</html>
