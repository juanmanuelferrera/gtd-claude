<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix User ID</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        input, button { margin: 5px; padding: 10px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Fix User ID Issue</h1>
    
    <div>
        <h3>Current Issue:</h3>
        <p>Your account has the stale user ID: <strong>56c2c350-3645-4729-a0cd-5b8d01a110a1</strong></p>
        <p>This is causing the login loop and 410 errors.</p>
    </div>
    
    <div>
        <h3>Solutions:</h3>
        <button onclick="createNewUser()">Create New User Account</button>
        <button onclick="updateExistingUser()">Update Existing User ID</button>
        <button onclick="checkCurrentUser()">Check Current User</button>
    </div>
    
    <div id="logs"></div>
    
    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logs.appendChild(div);
        }
        
        function logJSON(title, data) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log info';
            div.innerHTML = `<strong>${title}:</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
            logs.appendChild(div);
        }
        
        async function createNewUser() {
            log('🆕 Creating new user account...', 'info');
            
            const email = 'joanmanelferrera@gmail.com';
            const password = prompt('Enter a new password for the account:');
            
            if (!password) {
                log('❌ No password provided', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email: email,
                        password: password,
                        plan: 'pro'
                    })
                });
                
                const result = await response.json();
                logJSON('Registration Response', result);
                
                if (response.ok) {
                    log('✅ New user account created successfully!', 'success');
                    log('🔐 You can now login with the new password', 'success');
                } else {
                    log(`❌ Registration failed: ${result.message || result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Registration error: ${error.message}`, 'error');
            }
        }
        
        async function updateExistingUser() {
            log('🔄 Attempting to update existing user ID...', 'info');
            log('⚠️ This requires admin access to the database', 'warning');
            log('📧 Please contact support to update your user ID', 'info');
        }
        
        async function checkCurrentUser() {
            log('🔍 Checking current user data...', 'info');
            
            const authToken = localStorage.getItem('authToken');
            if (!authToken) {
                log('❌ No auth token found', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                logJSON('Current User Data', result);
                
                if (response.ok) {
                    log('✅ Current user data retrieved', 'success');
                    if (result.user?.id === '56c2c350-3645-4729-a0cd-5b8d01a110a1') {
                        log('🚫 CONFIRMED: User has stale user ID', 'error');
                    } else {
                        log('✅ User has valid user ID', 'success');
                    }
                } else {
                    log(`❌ Failed to get user data: ${result.message}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error checking user: ${error.message}`, 'error');
            }
        }
        
        // Auto-check on page load
        window.addEventListener('load', () => {
            log('📱 Page loaded - ready to fix user ID issue', 'info');
        });
    </script>
</body>
</html>
