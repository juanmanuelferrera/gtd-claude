<!DOCTYPE html>
<html>
<head>
    <title>Force Sync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f0f0f0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            background: #0056b3;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: #007bff; }
        #status {
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            background: #f8f9fa;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔄 Force Sync Tool</h1>
        <p>Use this to force download all tasks from the cloud to this device.</p>
        
        <button onclick="forceDownload()">⬇️ Force Download from Cloud</button>
        <button onclick="checkStatus()">📊 Check Current Status</button>
        <button onclick="clearAndSync()">🔧 Clear Local & Re-sync</button>
        <button onclick="location.href='/app'">📱 Go to App</button>
        
        <div id="status"></div>
    </div>

    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            status.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            status.scrollTop = status.scrollHeight;
        }
        
        async function checkStatus() {
            document.getElementById('status').innerHTML = '';
            log('Checking status...');
            
            const currentUser = localStorage.getItem('currentUser');
            const authToken = localStorage.getItem('authToken');
            const localTasks = localStorage.getItem('tasks');
            
            if (!currentUser || !authToken) {
                log('❌ Not logged in!', 'error');
                log('Please login at /login.html', 'error');
                return;
            }
            
            try {
                const user = JSON.parse(currentUser);
                log(`✅ Logged in as: ${user.user?.email}`, 'success');
                
                const tasks = localTasks ? JSON.parse(localTasks) : [];
                log(`📱 Local tasks: ${tasks.length}`);
                
                // Check cloud
                const response = await fetch(`${API_BASE}/tasks/${user.user.id}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`☁️ Cloud tasks: ${data.tasks?.length || 0}`, 'success');
                    
                    if (tasks.length === 0 && data.tasks?.length > 0) {
                        log('⚠️ Local is empty but cloud has tasks!', 'error');
                        log('Click "Force Download" to fix this', 'info');
                    }
                } else {
                    log(`❌ Cloud check failed: HTTP ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function forceDownload() {
            document.getElementById('status').innerHTML = '';
            log('Starting force download...');
            
            const currentUser = localStorage.getItem('currentUser');
            const authToken = localStorage.getItem('authToken');
            
            if (!currentUser || !authToken) {
                log('❌ Not logged in!', 'error');
                return;
            }
            
            try {
                const user = JSON.parse(currentUser);
                log(`Downloading tasks for: ${user.user?.email}`);
                
                // Download tasks
                const response = await fetch(`${API_BASE}/tasks/${user.user.id}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const cloudTasks = data.tasks || [];
                
                log(`✅ Downloaded ${cloudTasks.length} tasks from cloud`, 'success');
                
                // Save to localStorage
                localStorage.setItem('tasks', JSON.stringify(cloudTasks));
                localStorage.setItem('lastSync', new Date().toISOString());
                
                // Also set on window object for immediate use
                window.tasks = cloudTasks;
                
                log('✅ Tasks saved to local storage', 'success');
                log('✅ Sync complete!', 'success');
                log('');
                log('Click "Go to App" to see your tasks', 'info');
                
                // Try to trigger app refresh if it's loaded
                if (window.loadTasks) {
                    window.loadTasks();
                    log('✅ App refreshed', 'success');
                }
                
            } catch (error) {
                log(`❌ Download failed: ${error.message}`, 'error');
            }
        }
        
        async function clearAndSync() {
            document.getElementById('status').innerHTML = '';
            log('Clearing local tasks...');
            
            // Clear only tasks, keep auth
            localStorage.removeItem('tasks');
            localStorage.removeItem('lastSync');
            
            log('✅ Local tasks cleared');
            log('Now downloading fresh from cloud...');
            
            // Force download
            await forceDownload();
        }
        
        // Auto-check on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
