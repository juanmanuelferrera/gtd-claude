<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-info { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>🔍 Login Debug</h1>
    
    <div id="debug-info"></div>
    
    <button onclick="checkAuth()">Check Authentication</button>
    <button onclick="clearAll()">Clear All Data</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="goToMain()">Go to Main App</button>
    
    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function addInfo(message, type = 'info') {
            const container = document.getElementById('debug-info');
            const div = document.createElement('div');
            div.className = `debug-info ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            container.appendChild(div);
        }
        
        function clearAll() {
            localStorage.clear();
            sessionStorage.clear();
            addInfo('🧹 All storage cleared', 'success');
        }
        
        function checkAuth() {
            addInfo('🔍 Checking authentication data...', 'info');
            
            const authToken = localStorage.getItem('authToken');
            const authTokenExpiry = localStorage.getItem('authTokenExpiry');
            const userEmail = localStorage.getItem('userEmail');
            const userId = localStorage.getItem('userId');
            
            addInfo(`Token: ${authToken ? 'Present' : 'Missing'}`, authToken ? 'success' : 'error');
            addInfo(`Expiry: ${authTokenExpiry ? new Date(parseInt(authTokenExpiry)).toLocaleString() : 'Missing'}`, authTokenExpiry ? 'info' : 'error');
            addInfo(`Email: ${userEmail || 'Missing'}`, userEmail ? 'success' : 'error');
            addInfo(`User ID: ${userId || 'Missing'}`, userId ? 'success' : 'error');
            
            // Check if it's the stale user ID
            if (userId === '56c2c350-3645-4729-a0cd-5b8d01a110a1') {
                addInfo('🚫 STALE USER ID DETECTED!', 'error');
            }
            
            // Check if token is expired
            if (authTokenExpiry && Date.now() >= parseInt(authTokenExpiry)) {
                addInfo('⏰ Token is expired!', 'warning');
            }
            
            // Check sessionStorage
            const sessionToken = sessionStorage.getItem('authToken');
            addInfo(`Session Token: ${sessionToken ? 'Present' : 'Missing'}`, sessionToken ? 'success' : 'info');
        }
        
        async function testLogin() {
            addInfo('🔐 Testing login...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'testpassword'
                    })
                });
                
                addInfo(`Login test response: ${response.status}`, response.status === 401 ? 'success' : 'warning');
            } catch (error) {
                addInfo(`Login test error: ${error.message}`, 'error');
            }
        }
        
        function goToMain() {
            addInfo('🚀 Redirecting to main app...', 'info');
            setTimeout(() => {
                window.location.href = '/hyperfiler-pro.html';
            }, 1000);
        }
        
        // Auto-check on page load
        window.addEventListener('load', () => {
            addInfo('📱 Page loaded', 'info');
            checkAuth();
        });
    </script>
</body>
</html>
