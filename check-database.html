<!DOCTYPE html>
<html>
<head>
    <title>Database Check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f0f0f0;
        }
        .info {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Database Connection Check</h1>
    
    <div id="results"></div>
    
    <button onclick="checkConnection()">Run Check</button>
    <button onclick="clearLocalStorage()">Clear Local Storage</button>
    <button onclick="location.href='/app'">Go to App</button>

    <script>
        const API_BASE = window.location.hostname.includes('localhost') 
            ? 'http://localhost:8787' 
            : 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';

        function checkConnection() {
            const results = document.getElementById('results');
            let output = '';
            
            // Show loading
            results.innerHTML = '<div class="info">⏳ Checking...</div>';
            
            // Check device info
            output += '<div class="info">';
            output += '<h3>📱 Device Info:</h3>';
            output += 'User Agent: ' + navigator.userAgent.substring(0, 50) + '...<br>';
            output += 'Screen: ' + screen.width + 'x' + screen.height + '<br>';
            output += 'Is Mobile: ' + (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) + '<br>';
            output += 'Time: ' + new Date().toLocaleTimeString() + '<br>';
            output += '</div>';
            
            // Check API endpoint
            output += '<div class="info">';
            output += '<h3>🌐 API Configuration:</h3>';
            output += 'API Endpoint: <b>' + API_BASE + '</b><br>';
            output += 'Current URL: ' + window.location.href + '<br>';
            output += '</div>';
            
            // Check localStorage
            output += '<div class="info">';
            output += '<h3>💾 Local Storage:</h3>';
            const currentUser = localStorage.getItem('currentUser');
            const authToken = localStorage.getItem('authToken');
            const tasks = localStorage.getItem('tasks');
            
            if (currentUser) {
                try {
                    const user = JSON.parse(currentUser);
                    output += 'User Email: <b class="success">' + (user.user?.email || 'Unknown') + '</b><br>';
                    output += 'User ID: <b>' + (user.user?.id || 'Unknown') + '</b><br>';
                } catch(e) {
                    output += 'User Data: <span class="error">Invalid JSON</span><br>';
                }
            } else {
                output += 'User: <span class="warning">Not logged in</span><br>';
            }
            
            output += 'Auth Token: ' + (authToken ? '<span class="success">Present</span>' : '<span class="error">Missing</span>') + '<br>';
            
            if (tasks) {
                try {
                    const taskArray = JSON.parse(tasks);
                    output += 'Local Tasks: <b>' + taskArray.length + ' tasks</b><br>';
                } catch(e) {
                    output += 'Tasks: <span class="error">Invalid data</span><br>';
                }
            } else {
                output += 'Tasks: <span class="warning">No local tasks</span><br>';
            }
            output += '</div>';
            
            // Check cloud connection
            output += '<div class="info">';
            output += '<h3>☁️ Cloud Connection:</h3>';
            output += '<div id="cloudStatus">Checking...</div>';
            output += '</div>';
            
            results.innerHTML = output;
            
            // Test cloud connection with timeout
            if (authToken) {
                const user = JSON.parse(currentUser || '{}');
                if (user.user?.id) {
                    // Add timeout to prevent hanging
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout
                    
                    fetch(`${API_BASE}/tasks/${user.user.id}`, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        },
                        signal: controller.signal
                    })
                    .then(r => {
                        clearTimeout(timeoutId);
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        return r.json();
                    })
                    .then(data => {
                        const cloudStatus = document.getElementById('cloudStatus');
                        if (data.tasks) {
                            cloudStatus.innerHTML = '<span class="success">✅ Connected to cloud</span><br>' +
                                                   'Cloud Tasks: <b>' + data.tasks.length + ' tasks</b><br>' +
                                                   'Database: <b>Production (hyperfiler-prod)</b>';
                        } else {
                            cloudStatus.innerHTML = '<span class="error">❌ No tasks data received</span>';
                        }
                    })
                    .catch(error => {
                        const cloudStatus = document.getElementById('cloudStatus');
                        if (error.name === 'AbortError') {
                            cloudStatus.innerHTML = '<span class="error">❌ Connection timeout (5s)</span>';
                        } else {
                            cloudStatus.innerHTML = '<span class="error">❌ Connection failed: ' + error.message + '</span>';
                        }
                    });
                }
            } else {
                document.getElementById('cloudStatus').innerHTML = 
                    '<span class="warning">⚠️ Not authenticated</span>';
            }
        }
        
        function clearLocalStorage() {
            if (confirm('This will log you out and clear all local data. Continue?')) {
                localStorage.clear();
                alert('Local storage cleared. Please refresh the page.');
                location.reload();
            }
        }
        
        // Auto-run on load
        window.addEventListener('load', checkConnection);
    </script>
</body>
</html>
