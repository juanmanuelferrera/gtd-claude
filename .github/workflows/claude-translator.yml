name: Claude Translator

on:
  # Option 1: Trigger manually with a button
  workflow_dispatch:
    inputs:
      source_file:
        description: 'File to translate (e.g., nama.org, README.md)'
        required: true
        default: 'nama.org'
      target_language:
        description: 'Target language (e.g., Spanish, French, German)'
        required: true
        default: 'Spanish'

  # Option 2: Trigger by commenting on an issue or PR
  issue_comment:
    types: [created]

jobs:
  translate:
    # Only run if comment contains "@claude translate"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@claude translate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Claude Translation
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            I need you to translate text to ${{ github.event.inputs.target_language || 'Spanish' }}.

            ## Task:
            1. Read the file: ${{ github.event.inputs.source_file || 'nama.org' }}
            2. Translate ALL text to ${{ github.event.inputs.target_language || 'Spanish' }}
            3. Keep the same Org-mode formatting (headlines, lists, properties)
            4. Keep code blocks unchanged (don't translate code in #+BEGIN_SRC blocks)
            5. Keep Org-mode syntax unchanged (*, **, TODO, DONE, etc.)
            6. Use the Write tool to create the translated file:
               - For .org files: create filename-es.org (e.g., nama.org → nama-es.org)
               - For .md files: create filename-es.md
               - Put it in the same directory as the source file

            ## Translation Guidelines:
            - Maintain professional tone
            - Use natural language (not literal/robotic translation)
            - Keep technical terms in English if commonly used
            - Preserve links, URLs, and file paths
            - Keep emoji and special characters

            ## Important:
            - Use the Write tool to create the translated file
            - Do NOT use git commands - the workflow will commit automatically

      - name: Commit Translation
        run: |
          git config --local user.email "claude[bot]@users.noreply.github.com"
          git config --local user.name "claude[bot]"
          git add .
          git commit -m "Add ${{ github.event.inputs.target_language || 'Spanish' }} translation of ${{ github.event.inputs.source_file || 'nama.org' }}" || echo "No changes to commit"
          git push
