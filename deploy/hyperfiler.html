<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ HyperFiler Free - Task Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 200px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .section-button {
            padding: 15px 20px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 0;
            text-align: left;
        }

        .section-button:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .section-button.active {
            background: #667eea;
            color: white;
        }

        .section-button svg {
            width: 18px;
            height: 18px;
        }

        .section-button .task-count {
            margin-left: auto;
            background: #e5e7eb;
            color: #6b7280;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }

        .section-button.active .task-count {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .move-buttons {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            flex-direction: column;
            gap: 5px;
        }

        .move-buttons.show {
            display: flex;
        }

        .move-btn {
            padding: 8px 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .move-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .add-task-container {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }

        .add-task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .add-task-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-task-btn {
            padding: 12px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .add-task-btn:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }

        .tasks-container {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .task-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .task-item.selected {
            background: #f0f4ff;
            border-color: #667eea;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .task-checkbox.checked {
            background: #667eea;
            border-color: #667eea;
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .action-btn {
            padding: 4px 8px;
            background: #f3f4f6;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #e5e7eb;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .bulk-actions {
            padding: 15px 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: none;
            gap: 10px;
            align-items: center;
        }

        .bulk-actions.show {
            display: flex;
        }

        .bulk-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .bulk-delete {
            background: #fee2e2;
            color: #dc2626;
        }

        .bulk-delete:hover {
            background: #fecaca;
        }

        .bulk-complete {
            background: #d1fae5;
            color: #059669;
        }

        .bulk-complete:hover {
            background: #a7f3d0;
        }

        .bulk-restore {
            background: #dbeafe;
            color: #2563eb;
        }

        .bulk-restore:hover {
            background: #bfdbfe;
        }

        .bulk-empty-trash {
            background: #fef2f2;
            color: #dc2626;
        }

        .bulk-empty-trash:hover {
            background: #fecaca;
        }

        .section-info {
            color: #6b7280;
            font-size: 14px;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            
            .section-button span {
                display: none;
            }
            
            .move-buttons {
                left: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <button class="section-button active" data-section="inbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <span>Inbox</span>
            </button>
            <button class="section-button" data-section="today">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <polyline points="12,6 12,12 16,14"/>
                </svg>
                <span>Today</span>
            </button>
            <button class="section-button" data-section="monday">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
                <span>Monday</span>
            </button>
            <button class="section-button" data-section="month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                <span>Month</span>
            </button>
            <button class="section-button" data-section="calendar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>Calendar</span>
            </button>
            <button class="section-button" data-section="someday">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21,15 16,10 5,21"/>
                </svg>
                <span>Someday</span>
            </button>
            <button class="section-button" data-section="trash">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3,6 5,6 21,6"/>
                    <path d="M19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
                <span>Trash</span>
            </button>

            <div class="move-buttons" id="moveButtons">
                <button class="move-btn" data-target="inbox">Move to Inbox</button>
                <button class="move-btn" data-target="today">Move to Today</button>
                <button class="move-btn" data-target="monday">Move to Monday</button>
                <button class="move-btn" data-target="month">Move to Month</button>
                <button class="move-btn" data-target="calendar">Move to Calendar</button>
                <button class="move-btn" data-target="someday">Move to Someday</button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 class="section-title" id="sectionTitle">Inbox</h1>
                <div class="section-info" id="sectionInfo">Add tasks to get started</div>
            </div>

            <div class="add-task-container">
                <input type="text" class="add-task-input" id="addTaskInput" placeholder="Add a new task...">
                <button class="add-task-btn" id="addTaskBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add
                </button>
            </div>

            <div class="tasks-container" id="tasksContainer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10,9 9,9 8,9"/>
                    </svg>
                    <p>No tasks yet. Add your first task above!</p>
                </div>
            </div>

            <div class="bulk-actions" id="bulkActions">
                <button class="bulk-btn bulk-delete" id="bulkDelete">Delete Selected</button>
                <button class="bulk-btn bulk-complete" id="bulkComplete">Complete Selected</button>
                <button class="bulk-btn bulk-restore" id="bulkRestore" style="display: none;">Restore Selected</button>
                <button class="bulk-btn bulk-empty-trash" id="bulkEmptyTrash" style="display: none;">Empty Trash</button>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.currentSection = 'inbox';
                this.tasks = this.loadTasks();
                this.selectedTasks = new Set();
                this.isSelectionMode = false;
                this.touchStartY = 0;
                this.touchStartX = 0;
                
                this.initializeEventListeners();
                this.renderTasks();
                this.updateSectionInfo();
                this.updateTaskCounts();
            }

            initializeEventListeners() {
                // Section navigation
                document.querySelectorAll('.section-button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.switchSection(e.target.closest('.section-button').dataset.section);
                    });
                });

                // Add task
                const addTaskInput = document.getElementById('addTaskInput');
                const addTaskBtn = document.getElementById('addTaskBtn');

                addTaskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.addTask();
                    }
                });

                addTaskBtn.addEventListener('click', () => {
                    this.addTask();
                });

                // Auto-focus input when clicking on main content area
                document.querySelector('.main-content').addEventListener('click', (e) => {
                    if (e.target.closest('.add-task-container') || e.target.closest('.tasks-container')) {
                        addTaskInput.focus();
                    }
                });

                // Bulk actions
                document.getElementById('bulkDelete').addEventListener('click', () => {
                    this.deleteSelectedTasks();
                });

                document.getElementById('bulkComplete').addEventListener('click', () => {
                    this.completeSelectedTasks();
                });

                document.getElementById('bulkRestore').addEventListener('click', () => {
                    this.restoreSelectedTasks();
                });

                document.getElementById('bulkEmptyTrash').addEventListener('click', () => {
                    this.emptyTrash();
                });

                // Move buttons
                document.querySelectorAll('.move-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetSection = e.target.dataset.target;
                        this.moveSelectedTasks(targetSection);
                    });
                });

                // Touch events for mobile
                this.initializeTouchEvents();
            }

            initializeTouchEvents() {
                const tasksContainer = document.getElementById('tasksContainer');
                
                tasksContainer.addEventListener('touchstart', (e) => {
                    this.touchStartY = e.touches[0].clientY;
                    this.touchStartX = e.touches[0].clientX;
                });

                tasksContainer.addEventListener('touchmove', (e) => {
                    if (!this.touchStartY) return;
                    
                    const touchY = e.touches[0].clientY;
                    const touchX = e.touches[0].clientX;
                    const deltaY = Math.abs(touchY - this.touchStartY);
                    const deltaX = Math.abs(touchX - this.touchStartX);
                    
                    if (deltaY > 10 && deltaY > deltaX) {
                        this.isSelectionMode = true;
                        this.updateSelectionMode();
                    }
                });

                tasksContainer.addEventListener('touchend', () => {
                    this.touchStartY = 0;
                    this.touchStartX = 0;
                });
            }

            switchSection(section) {
                this.currentSection = section;
                
                // Update active button
                document.querySelectorAll('.section-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-section="${section}"]`).classList.add('active');
                
                // Update title
                const titles = {
                    inbox: 'Inbox',
                    today: 'Today',
                    monday: 'Monday',
                    month: 'Month',
                    calendar: 'Calendar',
                    someday: 'Someday',
                    trash: 'Trash'
                };
                document.getElementById('sectionTitle').textContent = titles[section];
                
                this.renderTasks();
                this.updateSectionInfo();
                this.updateTaskCounts();
                this.clearSelection();
                
                // Hide/show add task container based on section
                const addTaskContainer = document.querySelector('.add-task-container');
                if (addTaskContainer) {
                    addTaskContainer.style.display = this.currentSection === 'trash' ? 'none' : 'flex';
                }
            }

            addTask() {
                const input = document.getElementById('addTaskInput');
                const text = input.value.trim();
                
                if (!text) return;
                
                // Don't allow adding tasks to trash
                if (this.currentSection === 'trash') return;
                
                const task = {
                    id: Date.now().toString(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString(),
                    section: this.currentSection
                };
                
                if (!this.tasks[this.currentSection]) {
                    this.tasks[this.currentSection] = [];
                }
                
                this.tasks[this.currentSection].push(task);
                this.saveTasks();
                this.renderTasks();
                this.updateSectionInfo();
                this.updateTaskCounts();
                
                input.value = '';
                input.focus();
            }

            renderTasks() {
                const container = document.getElementById('tasksContainer');
                const sectionTasks = this.tasks[this.currentSection] || [];
                
                if (sectionTasks.length === 0) {
                    let message = `No tasks in ${this.currentSection}. Add your first task above!`;
                    if (this.currentSection === 'trash') {
                        message = 'Trash is empty. Deleted tasks will appear here.';
                    }
                    
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14,2 14,8 20,8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10,9 9,9 8,9"/>
                            </svg>
                            <p>${message}</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = sectionTasks.map(task => `
                    <div class="task-item ${this.selectedTasks.has(task.id) ? 'selected' : ''}" 
                         data-task-id="${task.id}">
                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                             onclick="taskManager.toggleTask('${task.id}')"></div>
                        <div class="task-text ${task.completed ? 'completed' : ''}">${this.escapeHtml(task.text)}</div>
                        <div class="task-actions">
                            <button class="action-btn delete-btn" onclick="taskManager.deleteTask('${task.id}')">
                                ${this.currentSection === 'trash' ? 'Delete Permanently' : 'Delete'}
                            </button>
                        </div>
                    </div>
                `).join('');
                
                // Add click handlers for selection
                container.querySelectorAll('.task-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.task-checkbox') || e.target.closest('.task-actions')) {
                            return;
                        }
                        this.toggleTaskSelection(item.dataset.taskId);
                    });
                });
            }

            toggleTask(taskId) {
                const sectionTasks = this.tasks[this.currentSection] || [];
                const task = sectionTasks.find(t => t.id === taskId);
                
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.renderTasks();
                    this.updateSectionInfo();
                }
            }

            toggleTaskSelection(taskId) {
                if (this.selectedTasks.has(taskId)) {
                    this.selectedTasks.delete(taskId);
                } else {
                    this.selectedTasks.add(taskId);
                }
                
                this.updateSelectionMode();
                this.renderTasks();
            }

            updateSelectionMode() {
                const hasSelection = this.selectedTasks.size > 0;
                
                document.getElementById('bulkActions').classList.toggle('show', hasSelection);
                
                // Show/hide appropriate buttons based on current section
                const bulkDelete = document.getElementById('bulkDelete');
                const bulkComplete = document.getElementById('bulkComplete');
                const bulkRestore = document.getElementById('bulkRestore');
                const bulkEmptyTrash = document.getElementById('bulkEmptyTrash');
                const moveButtons = document.getElementById('moveButtons');
                
                if (this.currentSection === 'trash') {
                    bulkDelete.style.display = 'none';
                    bulkComplete.style.display = 'none';
                    bulkRestore.style.display = hasSelection ? 'block' : 'none';
                    bulkEmptyTrash.style.display = 'block';
                    moveButtons.classList.remove('show');
                } else {
                    bulkDelete.style.display = hasSelection ? 'block' : 'none';
                    bulkComplete.style.display = hasSelection ? 'block' : 'none';
                    bulkRestore.style.display = 'none';
                    bulkEmptyTrash.style.display = 'none';
                    moveButtons.classList.toggle('show', hasSelection);
                }
                
                if (hasSelection) {
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'default';
                }
            }

            deleteTask(taskId) {
                const sectionTasks = this.tasks[this.currentSection] || [];
                const taskIndex = sectionTasks.findIndex(t => t.id === taskId);
                
                if (taskIndex !== -1) {
                    const task = sectionTasks[taskIndex];
                    
                    // Move to trash instead of permanent deletion
                    if (this.currentSection !== 'trash') {
                        task.section = 'trash';
                        task.deletedAt = new Date().toISOString();
                        
                        if (!this.tasks.trash) {
                            this.tasks.trash = [];
                        }
                        this.tasks.trash.push(task);
                        sectionTasks.splice(taskIndex, 1);
                    } else {
                        // Permanently delete from trash
                        sectionTasks.splice(taskIndex, 1);
                    }
                    
                    this.selectedTasks.delete(taskId);
                    this.saveTasks();
                    this.renderTasks();
                    this.updateSectionInfo();
                    this.updateTaskCounts();
                    this.updateSelectionMode();
                }
            }

            deleteSelectedTasks() {
                this.selectedTasks.forEach(taskId => {
                    this.deleteTask(taskId);
                });
                this.clearSelection();
            }

            completeSelectedTasks() {
                this.selectedTasks.forEach(taskId => {
                    const sectionTasks = this.tasks[this.currentSection] || [];
                    const task = sectionTasks.find(t => t.id === taskId);
                    if (task) {
                        task.completed = true;
                    }
                });
                this.saveTasks();
                this.renderTasks();
                this.updateSectionInfo();
                this.updateTaskCounts();
                this.clearSelection();
            }

            moveSelectedTasks(targetSection) {
                const tasksToMove = [];
                
                this.selectedTasks.forEach(taskId => {
                    const sectionTasks = this.tasks[this.currentSection] || [];
                    const taskIndex = sectionTasks.findIndex(t => t.id === taskId);
                    if (taskIndex !== -1) {
                        const task = sectionTasks[taskIndex];
                        task.section = targetSection;
                        tasksToMove.push(task);
                        sectionTasks.splice(taskIndex, 1);
                    }
                });
                
                if (!this.tasks[targetSection]) {
                    this.tasks[targetSection] = [];
                }
                
                this.tasks[targetSection].push(...tasksToMove);
                this.saveTasks();
                this.renderTasks();
                this.updateSectionInfo();
                this.clearSelection();
            }

            clearSelection() {
                this.selectedTasks.clear();
                this.updateSelectionMode();
                this.renderTasks();
            }

            updateSectionInfo() {
                const sectionTasks = this.tasks[this.currentSection] || [];
                const completed = sectionTasks.filter(t => t.completed).length;
                const total = sectionTasks.length;
                
                const info = document.getElementById('sectionInfo');
                if (this.currentSection === 'trash') {
                    if (total === 0) {
                        info.textContent = 'Trash is empty';
                    } else {
                        info.textContent = `${total} deleted tasks`;
                    }
                } else {
                    if (total === 0) {
                        info.textContent = 'Add tasks to get started';
                    } else {
                        info.textContent = `${completed} of ${total} completed`;
                    }
                }
            }

            updateTaskCounts() {
                const sections = ['inbox', 'today', 'monday', 'month', 'calendar', 'someday', 'trash'];
                
                sections.forEach(section => {
                    const button = document.querySelector(`[data-section="${section}"]`);
                    if (button) {
                        const count = (this.tasks[section] || []).length;
                        let countElement = button.querySelector('.task-count');
                        
                        if (!countElement) {
                            countElement = document.createElement('span');
                            countElement.className = 'task-count';
                            button.appendChild(countElement);
                        }
                        
                        countElement.textContent = count;
                    }
                });
            }

            restoreSelectedTasks() {
                this.selectedTasks.forEach(taskId => {
                    const sectionTasks = this.tasks[this.currentSection] || [];
                    const taskIndex = sectionTasks.findIndex(t => t.id === taskId);
                    
                    if (taskIndex !== -1) {
                        const task = sectionTasks[taskIndex];
                        // Restore to inbox
                        task.section = 'inbox';
                        delete task.deletedAt;
                        
                        if (!this.tasks.inbox) {
                            this.tasks.inbox = [];
                        }
                        this.tasks.inbox.push(task);
                        sectionTasks.splice(taskIndex, 1);
                    }
                });
                
                this.saveTasks();
                this.renderTasks();
                this.updateSectionInfo();
                this.updateTaskCounts();
                this.clearSelection();
            }

            emptyTrash() {
                if (confirm('Are you sure you want to permanently delete all items in the trash? This action cannot be undone.')) {
                    this.tasks.trash = [];
                    this.saveTasks();
                    this.renderTasks();
                    this.updateSectionInfo();
                    this.updateTaskCounts();
                    this.clearSelection();
                }
            }

            loadTasks() {
                try {
                    const saved = localStorage.getItem('hyperfiler-tasks');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    console.error('Error loading tasks:', e);
                    return {};
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('hyperfiler-tasks', JSON.stringify(this.tasks));
                } catch (e) {
                    console.error('Error saving tasks:', e);
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize the app
        const taskManager = new TaskManager();
        
        // Make taskManager globally available for sync system
        window.taskManager = taskManager;
    </script>
