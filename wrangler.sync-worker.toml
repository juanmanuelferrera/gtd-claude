name = "hyperfiler-sync"
main = "sync-worker.mjs"
compatibility_date = "2026-02-12"
workers_dev = true

# Mismo-origen que la app → el WebSocket deja de ser cross-site (Safari ITP) → instantáneo.
routes = [
  { pattern = "hyperfiler.pro/sync/*", zone_name = "hyperfiler.pro" },
  { pattern = "www.hyperfiler.pro/sync/*", zone_name = "hyperfiler.pro" }
]

# D1 de producción (para la migración perezosa desde user_tasks)
[[d1_databases]]
binding = "DB"
database_name = "hyperfiler-prod"
database_id = "47875cbd-ebb6-43d1-8109-6ccbc879c49e"

# Llamada interna worker→worker (sin pasar por el edge/WAF) para validar tokens.
[[services]]
binding = "API"
service = "hyperfiler-api"

[[durable_objects.bindings]]
name = "USER_SYNC"
class_name = "UserSyncDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncDO"]
