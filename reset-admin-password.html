<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        input, button { margin: 5px; padding: 10px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .step { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .code { background: #f1f3f4; font-family: monospace; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔐 Reset Admin Password</h1>
    
    <div class="step">
        <h3>Step 1: Generate New Admin Password</h3>
        <p>Enter a new admin password:</p>
        <input type="password" id="newPassword" placeholder="New Admin Password" value="">
        <button onclick="generateHash()">🔐 Generate Hash</button>
    </div>
    
    <div class="step">
        <h3>Step 2: Set Admin Password Hash</h3>
        <p>Copy this command and run it in your terminal:</p>
        <div id="wranglerCommand" class="code" style="display: none;"></div>
        <button onclick="copyCommand()" id="copyBtn" style="display: none;">📋 Copy Command</button>
    </div>
    
    <div class="step">
        <h3>Step 3: Test Admin Login</h3>
        <p>After setting the hash, test the admin login:</p>
        <input type="text" id="testUsername" placeholder="Admin Username" value="">
        <input type="password" id="testPassword" placeholder="Admin Password" value="">
        <button onclick="testAdminLogin()">🔐 Test Login</button>
    </div>
    
    <div id="logs"></div>
    
    <script>
        const API_BASE = 'https://hyperfiler-api.joanmanelferrera-400.workers.dev';
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logs.appendChild(div);
        }
        
        function logJSON(title, data) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log info';
            div.innerHTML = `<strong>${title}:</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
            logs.appendChild(div);
        }
        
        async function generateHash() {
            const password = document.getElementById('newPassword').value;
            
            if (!password) {
                log('Please enter a new admin password', 'error');
                return;
            }
            
            if (password.length < 8) {
                log('Password should be at least 8 characters long', 'warning');
            }
            
            log('🔐 Generating password hash...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/generate-admin-hash`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });
                
                const result = await response.json();
                logJSON('Hash Generation Response', result);
                
                if (response.ok && result.hash) {
                    log('✅ Password hash generated successfully!', 'success');
                    
                    // Show the wrangler command
                    const command = `echo "${result.hash}" | wrangler secret put ADMIN_PASSWORD_HASH --name hyperfiler-api`;
                    document.getElementById('wranglerCommand').textContent = command;
                    document.getElementById('wranglerCommand').style.display = 'block';
                    document.getElementById('copyBtn').style.display = 'inline-block';
                    
                    // Pre-fill test fields
                    document.getElementById('testUsername').value = 'admin';
                    document.getElementById('testPassword').value = password;
                    
                    log('📋 Copy the command above and run it in your terminal', 'info');
                    log('🔐 Then test the login with username: admin, password: [your new password]', 'info');
                } else {
                    log(`❌ Hash generation failed: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Hash generation error: ${error.message}`, 'error');
            }
        }
        
        function copyCommand() {
            const command = document.getElementById('wranglerCommand').textContent;
            navigator.clipboard.writeText(command).then(() => {
                log('📋 Command copied to clipboard!', 'success');
            }).catch(() => {
                log('❌ Failed to copy command', 'error');
            });
        }
        
        async function testAdminLogin() {
            const username = document.getElementById('testUsername').value;
            const password = document.getElementById('testPassword').value;
            
            if (!username || !password) {
                log('Please enter username and password', 'error');
                return;
            }
            
            log('🔐 Testing admin login...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                logJSON('Admin Login Test Response', result);
                
                if (response.ok) {
                    log('✅ Admin login successful!', 'success');
                    log('🔐 Admin password is working correctly', 'success');
                } else {
                    log(`❌ Admin login failed: ${result.error}`, 'error');
                    log('🔧 Make sure you ran the wrangler command to set the hash', 'warning');
                }
                
            } catch (error) {
                log(`❌ Admin login error: ${error.message}`, 'error');
            }
        }
        
        // Auto-focus on password
        window.addEventListener('load', () => {
            log('🔐 Admin password reset tool loaded', 'info');
            document.getElementById('newPassword').focus();
        });
    </script>
</body>
</html>
